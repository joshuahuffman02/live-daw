name: Live DAW CI

on:
  push:
  pull_request:

concurrency:
  group: live-daw-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: DSP, web, and native
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Check out sources
        uses: actions/checkout@v7

      - name: Build and test deterministic DSP
        run: |
          clang++ -std=c++17 -O2 \
            -Iappliance/dsp -Iappliance/src \
            appliance/tests/test_dsp.cpp \
            -o "${RUNNER_TEMP}/live-daw-test-dsp"
          "${RUNNER_TEMP}/live-daw-test-dsp"

      - name: Build and self-test deterministic replay evaluator
        run: |
          clang++ -std=c++17 -O2 \
            -Iappliance/dsp -Iappliance/src -Iappliance/tools \
            appliance/tools/replay_eval.cpp \
            -o "${RUNNER_TEMP}/automix-replay"
          "${RUNNER_TEMP}/automix-replay" --self-test

      - name: Build strict JUCE portability appliance
        run: |
          cmake \
            -S appliance \
            -B "${RUNNER_TEMP}/live-daw-juce" \
            -DBUILD_APP=ON \
            -DCMAKE_BUILD_TYPE=Release
          cmake \
            --build "${RUNNER_TEMP}/live-daw-juce" \
            --target BroadcastMixer \
            --parallel 3

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Verify browser proof
        working-directory: web
        run: |
          npm ci
          npm audit --audit-level=high
          npm run typecheck
          npm run build

      - name: Build and test native macOS app
        run: |
          xcodebuild test \
            -project native/AutoMixNative.xcodeproj \
            -scheme AutoMixNative \
            -configuration Debug \
            -destination 'platform=macOS,arch=arm64' \
            CODE_SIGNING_ALLOWED=NO
          plutil -lint native/AutoMixNative/AutoMixNative.entitlements
          xcodebuild build \
            -project native/AutoMixNative.xcodeproj \
            -scheme AutoMixNative \
            -configuration Release \
            -destination 'platform=macOS,arch=arm64' \
            CODE_SIGNING_ALLOWED=NO
