name: Live DAW CI

on:
  push:
  pull_request:

concurrency:
  group: live-daw-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  failover:
    name: External failover controller
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Check out sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Verify controller behavior and package rendering
        run: |
          bash -n failover/install-systemd-service.sh
          python3 -W error::ResourceWarning -m unittest -v \
            failover/test_automix_failover_supervisor.py

      - name: Verify the production systemd unit
        run: |
          if ! id automix-failover >/dev/null 2>&1; then
            sudo useradd --system \
              --home-dir /var/lib/automix-failover \
              --shell /usr/sbin/nologin \
              automix-failover
          fi
          sudo install -d -m 0755 /usr/local/libexec/automix-failover
          sudo install -m 0755 \
            failover/automix_failover_supervisor.py \
            /usr/local/libexec/automix-failover/automix_failover_supervisor.py
          systemd-analyze verify failover/automix-failover.service

  verify:
    name: DSP, web, and native
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Check out sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Lint deployment contracts
        run: |
          zsh -n scripts/*.sh scripts/test-support/*.sh
          bash -n failover/install-systemd-service.sh
          plutil -lint native/AutoMixNative/AutoMixNative.entitlements
          plutil -lint native/launchd/com.livedaw.automixnative.plist.template
          plutil -lint encoder/com.livedaw.obshealthbridge.plist.template
          plutil -lint egress/com.livedaw.hlsegresshealth.plist.template

      - name: Verify production and signed acceptance contracts
        run: |
          scripts/test-stream-health-evidence.sh
          scripts/test-runtime-incident-evidence.sh
          scripts/test-production-evidence-authoring.sh
          scripts/test-production-evidence.sh
          scripts/test-proof-acceptance.sh

      - name: Verify production host readiness audit
        run: |
          python3 -W error::ResourceWarning -m unittest -v \
            scripts/test_production_host_readiness.py

      - name: Verify OBS encoder health bridge
        run: |
          python3 -W error::ResourceWarning -m unittest -v \
            encoder/test_obs_health_bridge.py

      - name: Verify generated Xcode project
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
        run: |
          brew bundle --file Brewfile
          xcodegen generate --spec native/project.yml --project native
          git diff --exit-code -- native/AutoMixNative.xcodeproj/project.pbxproj

      - name: Verify public HLS egress observer
        env:
          AUTOMIX_REQUIRE_FFMPEG_TEST: "1"
        run: |
          python3 -W error::ResourceWarning -m unittest -v \
            egress/test_hls_health_bridge.py

      - name: Build and test deterministic DSP
        run: |
          clang++ -std=c++17 -O2 \
            -Iappliance/dsp -Iappliance/src \
            appliance/tests/test_dsp.cpp \
            -o "${RUNNER_TEMP}/live-daw-test-dsp"
          "${RUNNER_TEMP}/live-daw-test-dsp"

      - name: Build and self-test deterministic replay evaluator
        run: |
          clang++ -std=c++17 -O2 \
            -Iappliance/dsp -Iappliance/src -Iappliance/tools \
            appliance/tools/replay_eval.cpp \
            -o "${RUNNER_TEMP}/automix-replay"
          "${RUNNER_TEMP}/automix-replay" --self-test

      - name: Build strict JUCE portability appliance
        run: |
          cmake \
            -S appliance \
            -B "${RUNNER_TEMP}/live-daw-juce" \
            -DBUILD_APP=ON \
            -DCMAKE_BUILD_TYPE=Release
          cmake \
            --build "${RUNNER_TEMP}/live-daw-juce" \
            --target BroadcastMixer \
            --parallel 3

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Verify browser proof
        working-directory: web
        run: |
          npm ci
          npm audit --audit-level=high
          npm run typecheck
          npm run build

      - name: Build and test native macOS app
        run: |
          NATIVE_DERIVED_DATA="${RUNNER_TEMP}/live-daw-native"
          xcodebuild test \
            -project native/AutoMixNative.xcodeproj \
            -scheme AutoMixNative \
            -configuration Debug \
            -destination 'platform=macOS,arch=arm64' \
            -derivedDataPath "${NATIVE_DERIVED_DATA}" \
            CODE_SIGNING_ALLOWED=NO
          "${NATIVE_DERIVED_DATA}/Build/Products/Debug/AutoMix Native.app/Contents/MacOS/AutoMix Native" \
            --monitor-smoke
          plutil -lint native/AutoMixNative/AutoMixNative.entitlements
          xcodebuild build \
            -project native/AutoMixNative.xcodeproj \
            -scheme AutoMixNative \
            -configuration Release \
            -destination 'platform=macOS,arch=arm64' \
            -derivedDataPath "${NATIVE_DERIVED_DATA}" \
            CODE_SIGNING_ALLOWED=NO
