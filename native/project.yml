name: AutoMixNative
options:
  minimumXcodeGenVersion: 2.42.0
  deploymentTarget:
    macOS: "14.0"
settings:
  base:
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    SWIFT_VERSION: "6.0"
    ARCHS: arm64
targets:
  AutoMixNative:
    type: application
    platform: macOS
    sources:
      - path: AutoMixNative
        excludes:
          - RemoteWeb
      - path: AutoMixNative/RemoteWeb
        type: folder
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.livedaw.automixnative
        PRODUCT_NAME: AutoMix Native
        INFOPLIST_FILE: AutoMixNative/Info.plist
        MARKETING_VERSION: 0.1.0
        CURRENT_PROJECT_VERSION: 1
        CODE_SIGN_ENTITLEMENTS: AutoMixNative/AutoMixNative.entitlements
        SWIFT_OBJC_BRIDGING_HEADER: AutoMixNative/Audio/AutoMixNative-Bridging-Header.h
        CLANG_CXX_LANGUAGE_STANDARD: c++17
        CLANG_CXX_LIBRARY: libc++
        HEADER_SEARCH_PATHS:
          - "$(SRCROOT)/../appliance/dsp"
          - "$(SRCROOT)/../appliance/src"
      configs:
        Release:
          ENABLE_HARDENED_RUNTIME: YES
    dependencies:
      - sdk: CoreAudio.framework
      - sdk: AudioToolbox.framework
      - sdk: AVFoundation.framework
      - sdk: Security.framework
  AutoMixNativeTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: AutoMixNativeTests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.livedaw.automixnative.tests
        PRODUCT_NAME: AutoMix Native Tests
        INFOPLIST_FILE: AutoMixNativeTests/Info.plist
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/AutoMix Native.app/Contents/MacOS/AutoMix Native"
        BUNDLE_LOADER: "$(TEST_HOST)"
    dependencies:
      - target: AutoMixNative
schemes:
  AutoMixNative:
    build:
      targets:
        AutoMixNative: all
        AutoMixNativeTests: [test]
    test:
      targets:
        - AutoMixNativeTests
